name: Build & Release Pension ETF Helper APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Run Automated Simulation Tests
        run: flutter test

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.ref_name }}
          name: "미래에셋 연금모으기 6종목 풀오토 도우미 ${{ github.ref_name }}"
          body: |
            ## 🤖 미래에셋 연금모으기 6종목 풀오토(전자동) 주문 도우미 (${{ github.ref_name }})

            지정한 추천 요일·시간에 자동으로 앱과 M-STOCK이 켜지고, **지문 로그인 후 버튼 한 번만 누르면 1번부터 6번 종목까지 현재가 바로 위 칸(+5원) 가격으로 연속 자동 주문**하는 안드로이드 앱입니다.

            ### 🚀 주요 기능 (${{ github.ref_name }})
            - ⏰ **추천 요일·시간 자동 깨우기 & M-STOCK 자동 실행 (`AlarmManager`)**:
              - 원하는 요일(월요일/목요일 등)과 시간(예: 15:10 / 09:10)을 켜두면 정각에 화면이 자동으로 켜지면서 미니 리모컨과 M-STOCK이 즉시 실행됩니다 (`⚡5초뒤 테스트` 버튼으로 즉시 체험 가능).
            - ⚡ **현재가 바로 위 칸(`+5원`, 매도 1호가) 즉시체결가 자동 계산**:
              - 국내 ETF 호가단위(+5원)를 반영해 대기 없이 즉시 체결되면서도 종목별 예산을 단 1원도 초과하지 않는 최대 수량을 계산합니다.
            - 🤖 **로그인만 하면 끝나는 `[🚀 6종목 풀오토 자동매수]` (`AccessibilityService`)**:
              - M-STOCK 로그인 후 리모컨의 풀오토 시작 버튼을 누르면 `① 종목검색 → ② 위칸호가(+5원) 선택 → ③ 수량 입력 → ④ 매수 버튼 클릭 → ⑤ 주문 확인`을 1번부터 6번까지 연속 자동 수행합니다.
              - **`🎯 위치맞춤` 기능 탑재**: 내 폰 화면의 M-STOCK 버튼 위치에 5개 타겟을 드래그해 한 번만 저장하면 100% 정확한 위치를 터치합니다.

            ### 📲 다운로드 및 설치
            - 아래 **`app-release.apk`** 파일을 스마트폰에서 다운로드하여 바로 설치하실 수 있습니다.
          files: |
            build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
