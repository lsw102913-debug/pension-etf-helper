name: Build & Release Pension ETF Helper APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Run Automated Simulation Tests
        run: flutter test

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.ref_name }}
          name: "미래에셋 연금모으기 원터치 도우미 ${{ github.ref_name }} (6종목 자동계산 & 미니 리모컨)"
          body: |
            ## 📈 미래에셋 연금모으기 원터치 주문 도우미 (${{ github.ref_name }})

            오전 9시 30분 일괄 시장가 체결 피크를 피해 가장 저렴한 요일·시간대에 6개 종목을 연속 주문할 수 있는 안드로이드 전용 앱입니다.

            ### 🚀 주요 기능
            - 📋 **내 6종목(회차당 240,000원) 실시간 자동 수량 계산기**:
              - KODEX 미국S&P500 (90,000원) / TIGER KRX금현물 (20,000원) / KODEX 차이나CSI300 (25,000원) / KODEX 인도Nifty50 (20,000원) / KODEX 미국나스닥100 (70,000원) / TIGER 미국우주테크 (15,000원) 기본 세팅
              - 실시간 현재가 및 당일 09:30 가격 대비 절약 금액 자동 계산
            - 🎮 **M-STOCK 화면 위 플로팅 '미니 리모컨' ([1/6 ~ 6/6])**:
              - 미래에셋 M-STOCK 앱 화면 위에 작은 미니 리모컨이 떠서 `[◀ 이전] [종목복사] [수량복사] [다음 ▶]` 버튼 하나로 6개 종목 수량을 자동 복사하며 연속 주문 가능
            - 📊 **최적 요일 & 2주간 장중 시간대별 최저가 자동 분석**:
              - 요일별 상대 가격 순위 및 10분 단위(09:00~15:20) 장중 최저가 시간대 실시간 누적 추적
            - ✅ **6단계 자동 시뮬레이션 검증 탑재**

            ### 📲 다운로드 및 설치
            - 아래 **`app-release.apk`** 파일을 스마트폰에서 다운로드하여 바로 설치하실 수 있습니다.
          files: |
            build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
